<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Motion Catch Game</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; background: #0d1117; color: #fff;
    font-family: sans-serif; overflow: hidden;
  }
  #setup {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; z-index: 10;
    background: #0d1117;
  }
  #setup input {
    font-size: 2rem; text-align: center; letter-spacing: 6px; width: 220px;
    padding: 10px; border-radius: 8px; border: none; text-transform: uppercase;
  }
  #setup button {
    font-size: 1.2rem; padding: 10px 24px; border-radius: 8px; border: none;
    background: #58a6ff; color: #001; cursor: pointer;
  }
  #setup button:disabled { background: #444; color: #999; cursor: not-allowed; }
  #hud {
    position: absolute; top: 10px; left: 10px; font-size: 1.4rem; z-index: 5;
  }
  #calibrationLabel {
    position: absolute; top: 10px; width: 100%; text-align: center;
    font-size: 1.3rem; z-index: 5;
  }
  canvas { display: block; background: linear-gradient(#0d1117, #161b22); }
</style>
</head>
<body>

<div id="setup">
  <h1>Motion Catch</h1>
  <p>Enter the room code shown/typed on your phone app</p>
  <input id="roomInput" maxlength="4" placeholder="CODE" />
  <button id="connectBtn">Connect</button>
  <p id="status" style="opacity:0.7"></p>
</div>

<div id="calibrationLabel" style="display:none">
  Move around and check the dots track you correctly, then press
  <b>Enter</b> (or tap the screen) to start the game.
</div>
<div id="hud" style="display:none">Score: <span id="score">0</span></div>
<canvas id="game"></canvas>

<script>
const setupEl = document.getElementById("setup");
const statusEl = document.getElementById("status");
const hudEl = document.getElementById("hud");
const calibrationLabelEl = document.getElementById("calibrationLabel");
const scoreEl = document.getElementById("score");
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

// !!! CHANGE THIS to your deployed relay server address (wss://...) !!!
const SERVER_URL = "wss://motion-relay-server.onrender.com";

let ws = null;
let score = 0;

// Latest tracked points, normalized 0..1. Updated every time a pose
// message arrives from the phone.
let tracked = {
  nose: null,
  leftWrist: null,
  rightWrist: null,
};

let mode = "waiting";   // "waiting" -> "calibration" -> "playing"
let targets = [];

function connect(room) {
  ws = new WebSocket(`${SERVER_URL}/?room=${encodeURIComponent(room)}&role=game`);

  ws.onopen = () => { statusEl.textContent = "Connected. Waiting for phone..."; };

  ws.onmessage = (event) => {
    let msg;
    try { msg = JSON.parse(event.data); } catch (e) { return; }

    if (msg.type === "connected") {
      statusEl.textContent = "Waiting for your phone to join room " + room;
    }

    if (msg.type === "pose" && msg.landmarks) {
      // Mirror horizontally so moving right on your body moves right on
      // screen too, like looking in a mirror.
      if (msg.landmarks.nose) {
        tracked.nose = { x: 1 - msg.landmarks.nose.x, y: msg.landmarks.nose.y };
      }
      if (msg.landmarks.leftWrist) {
        tracked.leftWrist = { x: 1 - msg.landmarks.leftWrist.x, y: msg.landmarks.leftWrist.y };
      }
      if (msg.landmarks.rightWrist) {
        tracked.rightWrist = { x: 1 - msg.landmarks.rightWrist.x, y: msg.landmarks.rightWrist.y };
      }

      if (mode === "waiting") {
        enterCalibration();
      }
    }
  };

  ws.onclose = () => { statusEl.textContent = "Disconnected. Refresh to retry."; };
  ws.onerror = () => { statusEl.textContent = "Connection error."; };
}

document.getElementById("connectBtn").onclick = () => {
  const room = document.getElementById("roomInput").value.trim().toUpperCase();
  if (!room) return;
  statusEl.textContent = "Connecting...";
  connect(room);
};

function enterCalibration() {
  mode = "calibration";
  setupEl.style.display = "none";
  calibrationLabelEl.style.display = "block";
  requestAnimationFrame(loop);
}

function startGame() {
  if (mode !== "calibration") return;
  mode = "playing";
  calibrationLabelEl.style.display = "none";
  hudEl.style.display = "block";
  spawnTarget();
}

// Let the person press Enter, or tap/click anywhere, to move from
// calibration into the actual game once they're happy with the tracking.
window.addEventListener("keydown", (e) => { if (e.key === "Enter") startGame(); });
window.addEventListener("click", startGame);

function spawnTarget() {
  targets.push({
    x: Math.random(),
    y: -0.05,
    speed: 0.0025 + Math.random() * 0.0025,
  });
}

function drawTrackedPoint(point, color, label) {
  if (!point) return;
  const x = point.x * canvas.width;
  const y = point.y * canvas.height;
  ctx.beginPath();
  ctx.arc(x, y, 26, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.font = "16px sans-serif";
  ctx.fillStyle = "#fff";
  ctx.textAlign = "center";
  ctx.fillText(label, x, y - 36);
  return { x, y };
}

function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (mode === "calibration") {
    // Show all three tracked points clearly labeled, so it's obvious
    // on the TV exactly what is and isn't being detected right now.
    drawTrackedPoint(tracked.nose, "#58a6ff", "Head");
    drawTrackedPoint(tracked.leftWrist, "#2ecc71", "Left hand");
    drawTrackedPoint(tracked.rightWrist, "#e67e22", "Right hand");
    requestAnimationFrame(loop);
    return;
  }

  if (mode === "playing") {
    const avatar = drawTrackedPoint(tracked.nose, "#58a6ff", "");
    if (!avatar) { requestAnimationFrame(loop); return; }

    for (let i = targets.length - 1; i >= 0; i--) {
      const t = targets[i];
      t.y += t.speed;

      const tx = t.x * canvas.width;
      const ty = t.y * canvas.height;
      ctx.beginPath();
      ctx.arc(tx, ty, 16, 0, Math.PI * 2);
      ctx.fillStyle = "#f1c40f";
      ctx.fill();

      const dist = Math.hypot(tx - avatar.x, ty - avatar.y);
      if (dist < 40) {
        score++;
        scoreEl.textContent = score;
        targets.splice(i, 1);
        spawnTarget();
      } else if (t.y > 1.1) {
        targets.splice(i, 1);
        spawnTarget();
      }
    }

    requestAnimationFrame(loop);
  }
}
</script>
</body>
</html>
